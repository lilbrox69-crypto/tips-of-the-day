name: Tips of the Day - dnevno osvjezavanje

on:
  schedule:
    - cron: '10 6 * * *'   # 06:10 UTC = 08:10 po ljetnom vremenu u BiH
  workflow_dispatch:        # dugme "Run workflow" za rucno pokretanje
  push:                     # promjena izgleda stranice -> odmah nova verzija
    paths: ['index.html', 'analitika.html']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Kljucevi iz GitHub Secrets (cijeli config.json u jednom secretu CONFIG_JSON)
        shell: powershell
        env:
          CFG: ${{ secrets.CONFIG_JSON }}
        run: |
          $env:CFG | Set-Content -Encoding ascii config.json
      - name: Osvjezi podatke (svi sportovi, kvote, pracenje pogodaka, grbovi)
        shell: powershell
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: .\update.ps1

      - name: Sacuvaj kes (istorija, pogoci, rezultati)
        shell: powershell
        run: |
          git config user.name "tips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache cache_nba.json cache_nfl.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "Dnevni kes $(Get-Date -Format yyyy-MM-dd)"; git push }
          exit 0

      - name: Pripremi stranicu
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force site | Out-Null
          Copy-Item index.html, analitika.html, data.json, logos.json, history.json, analytics.json site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
